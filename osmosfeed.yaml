  - href: https://bldgblog.com/feed/

  # Julian Bleecker — design fiction, props from possible futures, speculative objects.
  - href: https://blog.nearfuturelaboratory.com/feed/

  # Jay Springett — futures, infrastructure, collapse, long-term thinking.
  - href: https://www.thejaymo.net/feed/

  # Internet and computing for a sustainable future.
