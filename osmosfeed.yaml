# ── Newsletters ──────────────────────────────────────────────────────────────

  # Patrick Tanguay — weekly curation of futures, tech, society. Best signal/noise ratio here.
  - href: https://sentiers.media/rss/

  # Matt Webb — design, AI, hardware, speculative thinking. Active 315-week streak.
  - href: https://interconnected.org/home/feed

  # Drew Austin — urbanism, infrastructure, technology and the built environment.
  - href: https://kneelingbus.substack.com/feed

  # Robin Sloan — fiction writer with sharp eye for media and culture. Also has a newsletter (robinsloan.com).
  - href: https://www.robinsloan.com/feed.xml

  # Ryan Broderick — internet culture, media, weird corners of the web.
  - href: https://garbageday.substack.com/feed

  # Sean Monahan — culture, trends, tech. K-HOLE founder. Coined "normcore" and "vibe shift".
  # Very good radar for subcultural signals before they surface.
  - href: https://8ball.substack.com/feed

  # L.M. Sacasas — technology and the human condition. Philosophical, unhurried.
  - href: https://theconvivialsociety.substack.com/feed

  # Venkatesh Rao — long-form thinking on strategy, culture, and the present moment.
  - href: https://www.ribbonfarm.com/feed/

  # Matt Muir — weekly firehose of internet links. Exhausting and invaluable.
  - href: https://webcurios.co.uk/feed/

  # Gordon Brander — tools for thought, collective intelligence, the future of knowledge.
  - href: https://subconscious.substack.com/feed

  # Warren Ellis — Sunday newsletter: culture, weird history, music, found objects.
  # Email-only at orbitaloperations.com — no RSS. The blog feed is listed under Culture below.

# ── Culture & Criticism ───────────────────────────────────────────────────────

  # Pop culture archaeology — pulp SF, paperback covers, cult objects of the 60s–80s.
  # Very Gibson's eBay brain.
  - href: https://wearethemutants.com/feed/

  # One of the original link-blogs. Culture, science, design, oddities. Still essential.
  - href: https://feeds.kottke.org/main

  # Andy Baio — music, film, internet culture, technology. Long-running and reliable.
  - href: https://waxy.org/feed/

  # Cory Doctorow — tech politics, monopoly, surveillance capitalism. High volume, high signal.
  - href: https://pluralistic.net/feed/

  # Essays on technology and lived experience. Sharp cultural criticism.
  - href: https://reallifemag.com/feed/

  # Warren Ellis — blog version. Culture, comics, weird history, found material.
  - href: http://warrenellis.ltd/feed/

  # Bruce Sterling — Tumblr stream of design, technology, strange objects.
  - href: https://brucesterling.tumblr.com/rss

  # Blackbird Spyplane — fashion/style with extremely sharp material-culture radar.
  # Gibson's eye for clothing as signal.
  - href: https://www.blackbirdspyplane.com/feed

